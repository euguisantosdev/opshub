name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Os testes de integração usam PostgreSQL embutido (zonky): não precisam de Docker nem de serviços externos.
      - name: Testes e cobertura
        run: mvn -B verify
      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            target/surefire-reports
            target/site/jacoco
